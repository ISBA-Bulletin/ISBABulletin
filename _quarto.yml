title: "The ISBA Bulletin"
subtitle: "March 2026 - Vol. 33 No. 1"
css: styles.css
project:
  type: website
  output-dir: docs
format:
  html:
    citeproc: true
    number-sections: false
    mainfont: roboto
    fontsize: "20px"
    grid:
      sidebar-width: 300px
      body-width: 1300px
      margin-width: 200px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 1
    toc-location: left
    toc-title: "In this issue"
    other-links:
      - text: "PDF version"
        icon: filetype-pdf
        href: "pdf/IB-2603.pdf"
      - text: "HTML ISBA Bulletin Archive"
        href: "html_arch/list_of_bulletins.html"  
        icon: filetype-html
      - text: "PDF ISBA Bulletin Archive"
        href: "https://bayesian.org/resources/bulletin/"
    page-layout: full
    embed-resources: true
    toc-expand: true
editor: source
execute:
  freeze: auto
title-block-banner: "#2c4878"